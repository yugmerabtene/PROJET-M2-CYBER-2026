services:
  serveur-soc:
    build:
      context: ./backend
    container_name: serveur-soc
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/devinciwatch
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - devinciwatch_net

  serveur-endpoint:
    build:
      context: ./endpoint
    container_name: serveur-endpoint
    env_file:
      - .env
    environment:
      DEVINCIWATCH_API_URL: http://serveur-soc:8000
      DEVINCIWATCH_SENSOR_ID: serveur-endpoint
    depends_on:
      - serveur-soc
    cap_add:
      - NET_RAW
    networks:
      - devinciwatch_net

  serveur-attacker:
    build:
      context: ./attacker
    container_name: serveur-attacker
    environment:
      TARGET_HOST: serveur-endpoint
      ATTACK_INTERVAL: "30"
    depends_on:
      - serveur-endpoint
    networks:
      - devinciwatch_net

  postgres:
    image: postgres:16-alpine
    container_name: devinciwatch_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devinciwatch
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devinciwatch_net

  redis:
    image: redis:7-alpine
    container_name: devinciwatch_redis
    networks:
      - devinciwatch_net

networks:
  devinciwatch_net:
    driver: bridge

volumes:
  postgres_data:
