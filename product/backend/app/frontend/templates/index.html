<!DOCTYPE html>
<html lang="fr" x-data="app()" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevinciWatch - SOC</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/soc.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        soc: {
                            bg: '#0a0e17',
                            card: '#111827',
                            border: '#1e293b',
                            accent: '#3b82f6',
                            danger: '#ef4444',
                            warning: '#f59e0b',
                            success: '#10b981',
                            text: '#e2e8f0',
                            muted: '#64748b'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-soc-bg text-soc-text min-h-screen font-mono">
    <!-- Sidebar -->
    <aside class="fixed top-0 left-0 w-64 h-full bg-soc-card border-r border-soc-border z-50 flex flex-col">
        <!-- Logo -->
        <div class="p-6 border-b border-soc-border">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-soc-accent rounded flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white">DevinciWatch</h1>
                    <span class="text-xs text-soc-muted">SOC Platform v0.5.0</span>
                </div>
            </div>
        </div>

        <!-- Navigation -->
        <nav class="flex-1 py-4 px-3 space-y-1">
            <a href="/dashboard" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors"
               :class="currentPage === 'dashboard' ? 'bg-soc-accent/10 text-soc-accent border-l-2 border-soc-accent' : 'text-soc-muted hover:bg-soc-bg hover:text-soc-text'"
               @click.prevent="navigate('dashboard')">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                </svg>
                Dashboard
            </a>
            <a href="/alerts" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors"
               :class="currentPage === 'alerts' ? 'bg-soc-accent/10 text-soc-accent border-l-2 border-soc-accent' : 'text-soc-muted hover:bg-soc-bg hover:text-soc-text'"
               @click.prevent="navigate('alerts')">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                Alertes
                <span x-show="alertsCount > 0" x-text="alertsCount" class="ml-auto bg-soc-danger text-white text-xs px-2 py-0.5 rounded-full"></span>
            </a>
            <a href="/events" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors"
               :class="currentPage === 'events' ? 'bg-soc-accent/10 text-soc-accent border-l-2 border-soc-accent' : 'text-soc-muted hover:bg-soc-bg hover:text-soc-text'"
               @click.prevent="navigate('events')">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                Evenements
            </a>
            <a href="/assets" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors"
               :class="currentPage === 'assets' ? 'bg-soc-accent/10 text-soc-accent border-l-2 border-soc-accent' : 'text-soc-muted hover:bg-soc-bg hover:text-soc-text'"
               @click.prevent="navigate('assets')">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/>
                </svg>
                Actifs
            </a>
            <a href="/correlations" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors"
               :class="currentPage === 'correlations' ? 'bg-soc-accent/10 text-soc-accent border-l-2 border-soc-accent' : 'text-soc-muted hover:bg-soc-bg hover:text-soc-text'"
               @click.prevent="navigate('correlations')">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/>
                </svg>
                Correlations
            </a>
            <a href="/reports" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-colors"
               :class="currentPage === 'reports' ? 'bg-soc-accent/10 text-soc-accent border-l-2 border-soc-accent' : 'text-soc-muted hover:bg-soc-bg hover:text-soc-text'"
               @click.prevent="navigate('reports')">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                </svg>
                Rapports
            </a>
        </nav>

        <!-- Status -->
        <div class="p-4 border-t border-soc-border">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full" :class="apiStatus === 'ok' ? 'bg-soc-success' : 'bg-soc-danger'"></div>
                <span class="text-xs text-soc-muted" x-text="apiStatus === 'ok' ? 'API Connectee' : 'API Deconnectee'"></span>
            </div>
            <div x-show="user" class="mt-3 pt-3 border-t border-soc-border">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded-full bg-soc-accent/20 flex items-center justify-center">
                        <span class="text-xs text-soc-accent" x-text="user?.username?.charAt(0).toUpperCase()"></span>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-sm text-white truncate" x-text="user?.username"></p>
                        <p class="text-xs text-soc-muted" x-text="user?.role"></p>
                    </div>
                </div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="ml-64 p-8 min-h-screen">
        <!-- Header -->
        <header class="flex items-center justify-between mb-8">
            <div>
                <h2 class="text-2xl font-bold text-white" x-text="pageTitle"></h2>
                <p class="text-soc-muted mt-1" x-text="pageSubtitle"></p>
            </div>
            <div class="flex items-center gap-4">
                <button @click="refreshData()" class="px-3 py-2 bg-soc-card border border-soc-border rounded-lg text-sm text-soc-muted hover:text-white transition-colors">
                    <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                    </svg>
                    Actualiser
                </button>
                <div class="text-sm text-soc-muted" x-text="new Date().toLocaleString('fr-FR')"></div>
            </div>
        </header>

        <!-- Content Area -->
        <div id="content" class="transition-opacity" :class="loading ? 'opacity-50' : 'opacity-100'">
            <!-- Login Form (shown when not authenticated) -->
            <template x-if="!isAuthenticated">
                <div class="max-w-md mx-auto mt-20">
                    <div class="bg-soc-card border border-soc-border rounded-xl p-8">
                        <div class="text-center mb-6">
                            <div class="w-16 h-16 bg-soc-accent/10 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg class="w-8 h-8 text-soc-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                                </svg>
                            </div>
                            <h3 class="text-xl font-bold text-white">Connexion DevinciWatch</h3>
                            <p class="text-soc-muted mt-2">Accedez a la plateforme SOC</p>
                        </div>
                        <form @submit.prevent="login()" class="space-y-4">
                            <div>
                                <label class="block text-sm text-soc-muted mb-1">Identifiant</label>
                                <input type="text" x-model="loginForm.username" class="w-full px-4 py-2.5 bg-soc-bg border border-soc-border rounded-lg text-white focus:border-soc-accent focus:ring-1 focus:ring-soc-accent outline-none transition-colors" placeholder="admin">
                            </div>
                            <div>
                                <label class="block text-sm text-soc-muted mb-1">Mot de passe</label>
                                <input type="password" x-model="loginForm.password" class="w-full px-4 py-2.5 bg-soc-bg border border-soc-border rounded-lg text-white focus:border-soc-accent focus:ring-1 focus:ring-soc-accent outline-none transition-colors" placeholder="••••••••">
                            </div>
                            <p x-show="loginError" x-text="loginError" class="text-soc-danger text-sm"></p>
                            <button type="submit" class="w-full py-2.5 bg-soc-accent hover:bg-blue-600 text-white rounded-lg font-medium transition-colors" :disabled="loginLoading">
                                <span x-show="!loginLoading">Se connecter</span>
                                <span x-show="loginLoading">Connexion...</span>
                            </button>
                        </form>
                    </div>
                </div>
            </template>

            <!-- Page Content (shown when authenticated) -->
            <template x-if="isAuthenticated">
                <div x-html="pageContent"></div>
            </template>
        </div>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
