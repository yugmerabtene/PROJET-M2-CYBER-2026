name: Bug Report
description: Report a bug found during DevinciWatch MVP development.
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical - blocks MVP
        - High - major feature broken
        - Medium - partial functionality issue
        - Low - cosmetic or minor
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend API - serveur-soc
        - Backend Workers - Celery
        - Frontend - Dashboard
        - Database - PostgreSQL
        - Cache - Redis
        - Docker/Lab - serveur-endpoint or serveur-attacker
        - Security - Auth, Roles, Audit
        - Documentation
    validations:
      required: true
  - type: input
    id: sprint
    attributes:
      label: Sprint
      placeholder: Sprint 1
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      value: Describe the bug clearly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Suggested Owner
      placeholder: Barbara Liskov, Ken Thompson, etc.
  - type: textarea
    id: proof
    attributes:
      label: Proof
      value: Screenshot, log, test output or export.
