name: Technical Task
description: Create a technical task linked to a DevinciWatch user story.
title: "[TASK] "
labels: ["task"]
body:
  - type: input
    id: task-id
    attributes:
      label: Task ID
      placeholder: T-XX.X.Y
    validations:
      required: true
  - type: input
    id: user-story
    attributes:
      label: Parent User Story
      placeholder: US-XX.X or issue #
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Backend - FastAPI route
        - Backend - SQLAlchemy model
        - Backend - Celery worker
        - Backend - Redis cache
        - Frontend - UI component
        - Frontend - Navigation
        - DevOps - Docker
        - Security - Auth/Roles
        - QA - Test case
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: owner
    attributes:
      label: Owner
      options:
        - Barbara Liskov
        - Ken Thompson
        - Tim Berners-Lee
        - Margaret Hamilton
        - Linus Torvalds
        - Radia Perlman
        - Alan Turing
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Task Description
      value: Describe the technical task.
    validations:
      required: true
  - type: input
    id: estimate
    attributes:
      label: Estimate
      placeholder: 2h, 4h, 1d
  - type: dropdown
    id: status
    attributes:
      label: Status
      options:
        - Backlog
        - Sprint Ready
        - In Progress
        - In Review
        - Done
    validations:
      required: true
  - type: input
    id: cross-refs
    attributes:
      label: Cross-references
      placeholder: Architecture §5.1
  - type: textarea
    id: proof
    attributes:
      label: Expected Proof
      value: Test result, commit hash, screenshot, log or export.
    validations:
      required: true
